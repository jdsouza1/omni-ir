# Runs typecheck, the raw-HTML guard, every test, the playground build and the npm package checks
# (build, contents check, install into a fresh project) on each push and pull request.
# Nothing here calls a paid API: tests use the mock model and fake clients, and no secrets are configured.
name: CI

on:
  push:
    branches: [main, "wip/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      OMNI_MODEL: mock # never use a paid model in CI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run playground:build
      - run: npm run build:packages
      - run: npm run pack:check
      - run: npm run install:test

  swift:
    # The Swift package (PLAN-IOS.md): the conformance suite and parser tests on Linux and macOS.
    # The macOS job also builds the SwiftUI library. Free on GitHub-hosted runners for public repos.
    name: Swift (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test
      - name: Build for iOS (simulator)
        if: runner.os == 'macOS'
        run: xcodebuild build -scheme OmniIR-Package -destination 'generic/platform=iOS Simulator' -quiet

  android-core:
    # The Kotlin parser and renderer logic (PLAN-ANDROID.md): conformance suite, parser, store and client tests.
    name: Android (Kotlin parser and runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :omni-ir-core:test :omni-ir-runtime:test --console=plain
