# Runs typecheck, the raw-HTML guard, every test, the playground build and the npm package checks
# (build, contents check, install into a fresh project) on each push and pull request.
# Nothing here calls a paid API: tests use the mock model and fake clients, and no secrets are configured.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      OMNI_MODEL: mock # never use a paid model in CI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run playground:build
      - run: npm run build:packages
      - run: npm run pack:check
      - run: npm run install:test
