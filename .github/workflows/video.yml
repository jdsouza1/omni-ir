# Records and edits the product demo video (PLAN-VIDEO.md): the iPhone simulator, the Android emulator
# and headless Chrome each play the story against the reference server (free mock model), then ffmpeg
# lines them up by the server's log and adds the Golden Circle cards and captions. Nothing paid:
# GitHub-hosted runners are free for public repos. Run it by hand from the Actions tab; give
# `from_run` to edit again from an earlier run's recordings without recording.
name: Video

on:
  # While it's being built: record on every push to its branch. Once on main, run it from the Actions tab.
  push:
    branches: ["wip/video"]
  workflow_dispatch:
    inputs:
      from_run:
        description: "Edit the recordings of this earlier run instead of recording again (a run id)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  ios:
    name: Record the iPhone scenes
    if: github.event_name == 'push' || inputs.from_run == ''
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd swift/Demo && xcodegen generate
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          phones = [d for d in devices if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] or [d for d in devices if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Build the app and UI tests
        run: |
          xcodebuild build-for-testing -project swift/Demo/OmniIRDemo.xcodeproj -scheme OmniIRDemo \
            -destination "id=$UDID" -derivedDataPath build -quiet
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Start the Omni-IR server (free mock model)
        env:
          OMNI_MODEL: mock # never a paid model in CI
          OMNI_AUTH: demo
        run: |
          npm ci
          nohup npm run server:start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8787/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Record the scenes
        shell: bash {0}
        run: |
          mkdir -p rec
          record() {
            xcrun simctl io "$UDID" recordVideo --codec h264 --force "rec/$1.mov" &
            recorder=$!
            python3 -c 'import time; print(time.time())' > "rec/$1.t0"
            xcodebuild test-without-building -project swift/Demo/OmniIRDemo.xcodeproj -scheme OmniIRDemo \
              -destination "id=$UDID" -derivedDataPath build -only-testing:"OmniIRDemoUITests/VideoTests/$2" -quiet
            status=$?
            kill -INT "$recorder"; wait "$recorder" || true
            return $status
          }
          record order testOrderMovesOnThenReturn && record delete testDeleteButtonStaysOff
          status=$?
          cp server.log rec/
          ls -la rec
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: video-ios
          path: rec/
          retention-days: 30

  android:
    name: Record the Android and web scenes
    if: github.event_name == 'push' || inputs.from_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Start the Omni-IR server (free mock model)
        env:
          OMNI_MODEL: mock # never a paid model in CI
          OMNI_AUTH: demo
          OMNI_CORS_ORIGIN: http://localhost:8790 # the web scene's page
        run: |
          npm ci
          nohup npm run server:start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8787/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Record the web scene in headless Chrome
        run: |
          npm run elements:build
          node scripts/video/record-web.mjs android/video/web
      - name: Build the app
        working-directory: android
        run: ./gradlew :demo:assembleDebug --console=plain
      - name: Record the Android scene on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          OMNI_SERVER: http://10.0.2.2:8787
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          working-directory: android
          script: bash scripts/video.sh
      - name: Collect
        if: always()
        run: cp server.log android/video/ || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: video-android
          path: android/video/
          retention-days: 30

  compose:
    name: Edit the video
    needs: [ios, android]
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.from_run != '') || (needs.ios.result == 'success' && needs.android.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null && ffmpeg -version | head -1
      - uses: actions/download-artifact@v8
        with:
          name: video-ios
          path: rec/ios
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: video-android
          path: rec/android
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Edit
        run: node scripts/video/compose.mjs rec video-out
      - uses: actions/upload-artifact@v7
        with:
          name: video
          path: |
            video-out/*.mp4
            video-out/*.gif
            video-out/*.png
            video-out/check/
          retention-days: 30
