<section class="flex flex-col gap-4 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
  <h1 class="text-2xl font-semibold text-gray-900">Payment</h1>
  <p class="text-sm text-gray-500">Shopping bag: Linen shirt, Canvas tote</p>
  <div class="flex flex-row flex-wrap gap-2 items-center">
    <p class="font-semibold text-gray-900">Total</p>
    <p class="font-semibold text-gray-900">$100.00</p>
  </div>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-gray-700">Note (optional)</span>
    <input type="text" name="note" placeholder="e.g. gift wrap, please" class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
  </label>
  <hr class="border-gray-200">
  <div class="flex flex-row flex-wrap gap-2 items-stretch">
    <button type="button" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700" data-tool="payments.confirm" data-params="{&quot;amount&quot;:&quot;#amount&quot;,&quot;note&quot;:&quot;#note&quot;}">Pay now</button>
    <button type="button" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-900 hover:bg-gray-50">Cancel</button>
  </div>
</section>
