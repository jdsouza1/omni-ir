<section class="flex flex-col gap-4 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
  <h1 class="text-2xl font-semibold text-gray-900">Report a broken item</h1>
  <p class="text-sm text-gray-500">Sorry your item arrived damaged. Tell us what happened and we'll make it right.</p>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-gray-700">Subject</span>
    <input type="text" name="subject" class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
  </label>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-gray-700">What happened?</span>
    <input type="text" name="message" placeholder="Order number, which item, and a short description of the damage" class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
  </label>
  <p class="text-sm text-gray-500">Keep the item and packaging until we reply. We usually respond within one business day.</p>
  <hr class="border-gray-200">
  <div class="flex flex-row flex-wrap gap-2 items-stretch">
    <button type="button" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700" data-tool="support.createTicket" data-params="{&quot;subject&quot;:&quot;#subject&quot;,&quot;message&quot;:&quot;#message&quot;}">Send to support</button>
    <button type="button" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-900 hover:bg-gray-50">Cancel</button>
  </div>
</section>
